<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wingman setup check</title>
<style>body{font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}li{margin:6px 0}</style></head>
<body>
<h1>Setup check</h1>
<p>Every line should start with ✅. Any ❌ is a file that is missing from your GitHub repo.</p>
<ul id="o"></ul>
<script>
const o = document.getElementById("o");
const add = t => { const li = document.createElement("li"); li.textContent = t; o.appendChild(li); return li; };
add((location.protocol === "https:" ? "✅" : "❌") + " page is served over https");
["index.html","style.css","app.js","sw.js","manifest.json","icon-192.png","icon-512.png","maskable-512.png"].forEach(async f => {
  const li = add("… " + f);
  try { const r = await fetch(f, { cache: "no-store" }); li.textContent = (r.ok ? "✅ " : "❌ missing: ") + f; }
  catch (e) { li.textContent = "❌ could not load: " + f; }
});
fetch("manifest.json").then(r => r.json()).then(() => add("✅ manifest.json is valid")).catch(() => add("❌ manifest.json is not valid"));
</script>
</body></html>
